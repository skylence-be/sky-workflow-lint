name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-workflow-lint
  cancel-in-progress: false

jobs:
  release:
    # Free-plan org: no runner groups — select by labels only.
    runs-on: [self-hosted, macOS, ARM64, heavy]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Persistent self-hosted runner: local GOCACHE beats the cache API.
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
